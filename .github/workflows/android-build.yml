
name: PojavXMojo Client Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PojavXMojo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Amethyst Android Source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git engine

      - name: Build Android APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=$(find engine/app_pojavlauncher/build/outputs/apk/debug \
            -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/PojavXMojo-Client.apk
          unzip -t release/PojavXMojo-Client.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavXMojo-Client-APK
          path: release/PojavXMojo-Client.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PojavXMojo Client Build ${{ github.run_number }}
          prerelease: true
          files: release/PojavXMojo-Client.apk
          
